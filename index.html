<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Games</title>
    <meta name="description" content="Browser games by rownok-HR-LS." />
    <style>
      :root {
        color-scheme: dark;
        --ink: #fff4ef;
        --muted: #c9a59b;
        --line: rgba(255, 90, 60, 0.22);
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background: radial-gradient(circle at 50% -10%, #3a0a0b, #0b0506 60%);
        color: var(--ink);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      main { max-width: 960px; margin: 0 auto; padding: 56px 16px 64px; }
      h1 { margin: 0 0 6px; font-size: clamp(34px, 7vw, 52px); letter-spacing: -0.02em; }
      .lede { margin: 0 0 32px; color: var(--muted); }
      .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 20px; padding: 0; list-style: none; }
      .card { position: relative; overflow: hidden; border: 1px solid var(--line); border-radius: 18px; background: #160a0c; transition: transform 0.2s ease, border-color 0.2s ease; }
      .card:hover { border-color: #ff5a1f; transform: translateY(-3px); }
      .poster { display: flex; flex-direction: column; justify-content: center; gap: 6px; height: 190px; text-align: center; }
      .poster b { font-size: 34px; font-weight: 900; font-style: italic; letter-spacing: 0.04em; text-transform: uppercase; }
      .brick {
        background:
          radial-gradient(circle at 78% 58%, rgba(255, 60, 30, 0.55) 0 34px, rgba(255, 40, 20, 0.18) 35px, transparent 90px),
          linear-gradient(180deg, #050206, #2a0709 55%, #8a2a0e);
      }
      .brick b { background: linear-gradient(180deg, #ffd36a, #ff5a1f 55%, #c4120a); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 3px 12px rgba(255, 60, 20, 0.6)); }
      .brick span { color: #e8b8a8; font-size: 13px; }
      .body { padding: 16px 18px 20px; }
      .body h2 { margin: 0 0 6px; font-size: 19px; }
      .body a { color: inherit; text-decoration: none; }
      .body a::after { content: ""; position: absolute; inset: 0; }
      .body p { margin: 0; color: var(--muted); font-size: 14px; line-height: 1.5; }
    </style>
  </head>
  <body>
    <main>
      <h1>Games</h1>
      <p class="lede">Browser games. Play on desktop or phone.</p>
      <ul class="grid">
        <li class="card">
          <div class="poster brick" aria-hidden="true">
            <b>Brick Blaster</b>
            <span>A tribute to the classic DX-Ball</span>
          </div>
          <div class="body">
            <h2><a href="./brick-blaster/">Brick Blaster</a></h2>
            <p>A DX-Ball-style brick breaker set in a hellscape: 10 levels, 10 power-ups, a metal soundtrack for every level, and full screen on phones.</p>
          </div>
        </li>
      </ul>
    </main>
  </body>
</html>
